name: 体验建议
description: 描述希望改善的截图、标注、贴图或选字操作
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      placeholder: "目前哪一步不方便？你通常怎样操作？"
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: 希望的效果
    validations:
      required: true
